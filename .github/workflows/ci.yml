name: Verify and publish
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r _integrated/requirements.txt -r core/requirements.txt Pillow pytest PyYAML
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q core workers _common _src services/telegram/app
      - run: python -m pytest tests -q
      - run: python -m unittest test_integrated.py test_integration.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: frontend
  verify-telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/telegram/requirements-dev.txt
      - run: python -m compileall -q services/telegram/app
      - run: python -m pytest -q
        working-directory: services/telegram
  verify-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: console
            context: .
            file: containers/console.Dockerfile
            executable: python
            smoke: "import core.app"
          - image: engines
            context: .
            file: containers/engines.Dockerfile
            executable: python
            smoke: "import workers.platform_job, gallery_dl, yt_dlp, f2"
          - image: telegram
            context: .
            file: containers/telegram.Dockerfile
            executable: python
            smoke: "import app.bot, app.previews, telethon, cryptg, workers.telegram_delivery"
          - image: xhs
            context: .
            file: containers/xhs.Dockerfile
            executable: python
            smoke: "import source.application.app, workers.xhs_job"
          - image: media
            context: .
            file: containers/media.Dockerfile
            executable: python3
            smoke: "import core.media, workers.media_worker"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: nas-download-${{ matrix.image }}:verify
          cache-from: type=gha,scope=${{ matrix.image }}-verify
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-verify
      - name: Import workers using the packaged dependencies
        env:
          SMOKE_CODE: ${{ matrix.smoke }}
        run: docker run --rm --entrypoint ${{ matrix.executable }} nas-download-${{ matrix.image }}:verify -c "$SMOKE_CODE"
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, verify-telegram, verify-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: nas-download-console
            context: .
            file: containers/console.Dockerfile
          - image: nas-download-engines
            context: .
            file: containers/engines.Dockerfile
          - image: nas-download-telegram
            context: .
            file: containers/telegram.Dockerfile
          - image: nas-download-xhs
            context: .
            file: containers/xhs.Dockerfile
          - image: nas-download-media
            context: .
            file: containers/media.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: APP_VERSION=${{ github.ref_name }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
